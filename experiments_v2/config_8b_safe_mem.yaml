# Same as config_8b.yaml but with lower gpu_memory_utilization to avoid
# OOM + preemption-triggered cuda_assert in reload mode.
# Copy+modify — don't symlink, need standalone for --config flag.

model: "meta-llama/Llama-3.1-8B-Instruct"
model_tag: "8B"
max_model_len: 8192
gpu_memory_utilization: 0.85  # ← reduced from 0.90
dtype: "float16"
enforce_eager: true
dp_size: 2

ft_prefill_throughput: 4000.0
ft_decode_throughput: 2000.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 1.0
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_8b.json"
ft_decode_capacity_profile: "experiments_v2/decode_capacity_profile_8b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 8589934592

force_output_len: true

workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Chatbot, decode-heavy"

  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Summarization, prefill-heavy"

  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
    description: "Instruction-following, tight SLO"

  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"
    description: "Production mix"

  W5_LongDoc:
    dataset: "arxiv"
    dataset_path: "experiments_v2/datasets/cached/arxiv_filtered.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Long-context summarization (ArXiv papers, prompt_tokens <= 5500)"

  W7_Saturated:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Queue-saturation stress"

load_levels:
  Light:    {pct: 0.25, rps: 0.5}
  Moderate: {pct: 0.40, rps: 1.0}
  Heavy:    {pct: 0.55, rps: 1.5}

slo:
  ttft_ms: 2000.0
  failure_gap_ms: 3000.0
  ttft_base_ms: 200.0
  gap_base_ms: 1000.0

fault_timing:
  none: null
  F1_Early: 60.0
  F2_Mid: 150.0
  F3_Late: 240.0

run_duration_sec: 300.0
warmup_sec: 30.0
seeds: [42]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

baselines:
  NoFT-Reprefill:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: false
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0
  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0
  Our-System-NoCkpt:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: false
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

experiments:
  E0_Smoke:
    description: "Pipeline validation"
    baselines: ["NoFT-Reprefill", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

results_dir: "results_v2"
