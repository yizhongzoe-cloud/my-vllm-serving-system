# Experiment configuration — Llama-3.2-1B (development & pipeline testing)
# NOT for paper results. Use config_8b.yaml / config_70b.yaml for that.

# ---- Hardware & Model ----
model: "meta-llama/Llama-3.2-1B-Instruct"
model_tag: "1B"
max_model_len: 2048
gpu_memory_utilization: 0.45
dtype: "float16"
enforce_eager: true
dp_size: 2

# ---- Solver / FT parameters ----
# Tuned from tiny experiment: original 4000/2000 caused 33% rejection
ft_prefill_throughput: 40000.0   # actual ~45000 tok/s for 1B
ft_decode_throughput: 150.0      # actual ~143 tok/s per-request
ft_load_bandwidth: 10.0e9       # 10 GB/s host→GPU
ft_planning_horizon: 0.5
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_1b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 8589934592  # 8 GB

# ---- Force output length ----
# When true, run.py sends min_tokens = expected_output_len to prevent early EOS.
# This ensures actual output length matches the dataset's expected length.
force_output_len: true

# ---- Workloads ----
workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Chatbot, decode-heavy"

  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Summarization, prefill-heavy"

  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
    description: "Instruction-following, tight SLO"

  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"
    description: "Production mix, per-request SLO differentiation"

# ---- Load levels ----
# pct: fraction of single-GPU saturation capacity.
# rps: absolute RPS, filled by calibrate.py (null = not yet calibrated).
load_levels:
  Light:    {pct: 0.25, rps: null}
  Moderate: {pct: 0.40, rps: null}
  Heavy:    {pct: 0.55, rps: null}

# ---- SLO ----
# ttft_ms and failure_gap_ms are calibrated by calibrate.py.
# TPOT SLO is per-workload (defined above).
slo:
  ttft_ms: null             # = 5 × TTFT_base, filled by calibrate.py
  failure_gap_ms: null      # = 3 × max(Gap_base), filled by calibrate.py
  ttft_base_ms: null        # raw baseline, for reference
  gap_base_ms: null         # raw baseline, for reference

# ---- Fault injection timing (seconds from experiment start) ----
fault_timing:
  none: null
  F1_Early: 60.0
  F2_Mid: 150.0
  F3_Late: 240.0

# ---- Run parameters ----
run_duration_sec: 300.0
warmup_sec: 30.0
seeds: [42, 123, 456]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

# ---- Baseline configurations ----
baselines:
  No-FT:
    scheduling_policy: "fcfs"
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0

  Periodic-Low:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Periodic-High:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 1

  Benders-Only:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Adaptive-Only:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

# ---- Experiment definitions ----
experiments:
  E0_Smoke:
    description: "Pipeline validation (1B dev)"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

  E1a_Main:
    # 6×4×3×4 = 288 runs per seed
    description: "End-to-end results"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High",
                 "Benders-Only", "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none", "F1_Early", "F2_Mid", "F3_Late"]

  E2_Recovery:
    # 4×2×1×1 = 8 runs per seed
    description: "Recovery breakdown"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]

  E3_Ablation:
    # 5×2×2×2 = 40 runs per seed
    description: "Joint optimization ablation"
    baselines: ["Periodic-Low", "Periodic-High", "Benders-Only",
                 "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E4_Checkpoint_Tradeoff:
    # 4×1×2×2 = 16 runs per seed
    description: "Checkpoint overhead vs recovery benefit"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E5_Controller:
    # 1×4×3×1 = 12 runs per seed
    description: "Solver overhead"
    baselines: ["Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none"]

  E6_SLO_Sensitivity:
    # 2×2×1×1 = 4 runs per seed × 3 slo_scales = 12 runs per seed
    description: "SLO sensitivity analysis"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]
    slo_scales:
      Tight:    {ttft_mult: 3.0,  gap_mult: 1.5}
      Moderate: {ttft_mult: 5.0,  gap_mult: 3.0}
      Loose:    {ttft_mult: 10.0, gap_mult: 5.0}

# ---- Output ----
results_dir: "results_v2"
