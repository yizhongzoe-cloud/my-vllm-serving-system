model: meta-llama/Llama-3.1-8B-Instruct
model_tag: 8B
max_model_len: 66000
gpu_memory_utilization: 0.9
dtype: float16
enforce_eager: true
dp_size: 1
ft_prefill_throughput: 4000.0
ft_decode_throughput: 2000.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 1.0
ft_checkpoint_cost_profile: experiments_v2/checkpoint_cost_profile_8b.json
ft_decode_capacity_profile: experiments_v2/decode_capacity_profile_8b.json
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 137438953472
force_output_len: true

workloads:
  W_Ruler1K_Low:
    dataset: ruler_1024_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_1024_niah_trunc.jsonl
    tpot_slo_ms: 100.0
    arrival: poisson
    description: RULER NIAH 1024 tokens, low-RPS to isolate ckpt overhead
  W_Ruler4K_Low:
    dataset: ruler_4096_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_4096_niah_trunc.jsonl
    tpot_slo_ms: 200.0
    arrival: poisson
    description: RULER NIAH 4096 tokens, low-RPS to isolate ckpt overhead
  W_Ruler64K:
    dataset: ruler_64k_niah
    dataset_path: experiments_v2/datasets/cached/ruler_64k_niah.jsonl
    tpot_slo_ms: 1000.0
    arrival: poisson
    description: RULER NIAH 65K tokens — long-context scaling extension

# Lower RPS for 1K/4K (1/3 of original) to isolate whether 1K/4K
# throughput drop in main V3 sweep was driven by high RPS or by
# checkpoint mechanism overhead independent of RPS.
# 64K uses very low RPS because per-req prefill is ~16s on A6000.
load_levels:
  Pressure_1K_Low:
    pct: 0.85
    rps: 4.0
  Pressure_4K_Low:
    pct: 0.85
    rps: 2.5
  Pressure_64K:
    pct: 0.85
    rps: 0.15

slo:
  ttft_ms: 60000.0
  failure_gap_ms: 5000.0
  ttft_base_ms: 1500.0
  gap_base_ms: 4000.0

fault_timing:
  none: null

run_duration_sec: 360.0
warmup_sec: 60.0
seeds:
- 42
- 123
- 456
request_timeout_sec: 900.0
server_startup_timeout: 600.0

baselines:
  NoFT-Reprefill:
    scheduling_policy: fcfs
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0
  CkptReload:
    scheduling_policy: fault_tolerant
    enable_checkpointing: true
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 1

experiments:
  E_Extension:
    description: Short-context low-RPS isolation + 64K scaling
    baselines:
    - NoFT-Reprefill
    - CkptReload
    workloads:
    - W_Ruler1K_Low
    - W_Ruler4K_Low
    - W_Ruler64K
    load_levels:
    - Pressure_1K_Low
    - Pressure_4K_Low
    - Pressure_64K
    faults:
    - none
