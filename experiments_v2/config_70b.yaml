# Experiment configuration — Llama-3.1-70B (scalability validation)
# Only runs E1b (compact) + E2/E4/E5 70B portions.

# ---- Hardware & Model ----
model: "meta-llama/Llama-3.1-70B-Instruct"
model_tag: "70B"
max_model_len: 4096
gpu_memory_utilization: 0.90
dtype: "float16"
enforce_eager: true
dp_size: 2

# ---- Solver / FT parameters ----
ft_prefill_throughput: 4000.0
ft_decode_throughput: 2000.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 1.0
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_70b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 137438953472  # 128 GB

force_output_len: true

# ---- Workloads ----
workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Chatbot, decode-heavy"

  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Summarization, prefill-heavy"

  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
    description: "Instruction-following, tight SLO"

  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"
    description: "Production mix, per-request SLO differentiation"

# ---- Load levels ----
load_levels:
  Light:    {pct: 0.25, rps: null}
  Moderate: {pct: 0.40, rps: null}
  Heavy:    {pct: 0.55, rps: null}

# ---- SLO ----
slo:
  ttft_ms: null
  failure_gap_ms: null
  ttft_base_ms: null
  gap_base_ms: null

# ---- Fault injection ----
fault_timing:
  none: null
  F1_Early: 60.0
  F2_Mid: 150.0
  F3_Late: 240.0

# ---- Run parameters ----
run_duration_sec: 300.0
warmup_sec: 30.0
seeds: [42, 123, 456]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

# ---- Baselines ----
baselines:
  No-FT:
    scheduling_policy: "fcfs"
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0

  Periodic-Low:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Periodic-High:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 1

  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

# ---- Experiments (70B subset) ----
experiments:
  E0_Smoke:
    description: "Pipeline validation (70B)"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

  E1b_Main:
    # 3×2×2×2 = 24 runs per seed
    description: "End-to-end (70B validation)"
    baselines: ["No-FT", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E2_Recovery:
    # 3×2×1×1 = 6 runs per seed
    description: "Recovery breakdown (70B)"
    baselines: ["No-FT", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]

  E4_Checkpoint_Tradeoff:
    # 3×1×2×2 = 12 runs per seed
    description: "Checkpoint tradeoff (70B)"
    baselines: ["No-FT", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E5_Controller:
    # 1×4×3×1 = 12 runs per seed
    description: "Solver overhead (70B)"
    baselines: ["Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none"]

results_dir: "results_v2"
