<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30" font-weight="bold" fill="#111827">Evaluation setup at a glance</text>
    <line x1="60" y1="105" x2="1220" y2="105" stroke="#D1D5DB" stroke-width="1"/>
    <text x="60" y="135" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="16" fill="#4B5563">3 seeds per configuration · mean ± std reported.</text>
  </g>

  <g id="setup-matrix">
    <line x1="60" y1="170" x2="1220" y2="170" stroke="#111827" stroke-width="1"/>

    <g id="row-hardware">
      <text x="60" y="207" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">HARDWARE</text>
      <text x="280" y="207" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">2 × NVIDIA A6000 PCIe</text>
      <text x="280" y="232" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">48 GB each  ·  portability check on 2 × L40S (same model, different SM)</text>
      <line x1="60" y1="255" x2="1220" y2="255" stroke="#D1D5DB" stroke-width="0.5"/>
    </g>

    <g id="row-model">
      <text x="60" y="290" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">MODEL</text>
      <text x="280" y="290" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">Qwen2.5-7B-Instruct  ·  fp16</text>
      <text x="280" y="315" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563"><tspan font-family="Consolas, &quot;Courier New&quot;, monospace">max_model_len 32K</tspan>  ·  32K extension via Qwen2.5-7B-Instruct-1M noted as future work</text>
      <line x1="60" y1="338" x2="1220" y2="338" stroke="#D1D5DB" stroke-width="0.5"/>
    </g>

    <g id="row-workloads">
      <text x="60" y="373" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">WORKLOADS</text>
      <text x="280" y="373" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">RULER 16K  +  ShareGPT</text>
      <text x="280" y="398" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">RULER 16K — long-context regime we target  ·  ShareGPT — short-context regime we must not break</text>
      <text x="280" y="418" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Poisson arrivals  ·  Niyama-style 3-tier QoS (tight / normal / loose) in the main figure</text>
      <line x1="60" y1="441" x2="1220" y2="441" stroke="#D1D5DB" stroke-width="0.5"/>
    </g>

    <g id="row-slo">
      <text x="60" y="476" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">SLO CALIBRATION</text>
      <text x="280" y="476" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">baseline P95 × {1.5×, 3×, 6×}</text>
      <text x="280" y="501" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Baseline P95 measured on <tspan font-family="Consolas, &quot;Courier New&quot;, monospace">vllm_fcfs</tspan> at uncontested low QPS (0.02 for RULER, 0.1 for ShareGPT)</text>
      <text x="280" y="521" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Per-class SLO tiers: tight / normal / loose = 1.5× / 3× / 6× baseline P95</text>
      <line x1="60" y1="544" x2="1220" y2="544" stroke="#D1D5DB" stroke-width="0.5"/>
    </g>

    <g id="row-baselines">
      <text x="60" y="579" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">BASELINES</text>
      <text x="280" y="579" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">4-way comparison</text>

      <g id="baseline-fcfs">
        <text x="280" y="608" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#111827">vllm_fcfs</text>
        <text x="430" y="608" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">no router, no FT — floor</text>
      </g>
      <g id="baseline-reroute">
        <text x="700" y="608" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#111827">reroute_no_ckpt</text>
        <text x="900" y="608" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">router on, no FT — isolates router cost</text>
      </g>
      <g id="baseline-ours-nopicker">
        <text x="280" y="634" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#111827">ours_no_picker</text>
        <text x="430" y="634" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">FT on, slack picker off — ablation</text>
      </g>
      <g id="baseline-ours">
        <text x="700" y="634" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="bold" fill="#111827">ours</text>
        <text x="900" y="634" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#111827"><tspan font-weight="bold">full system</tspan></text>
      </g>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">Disruption-Aware SLO Scheduling — APSys 2026 draft</text>
    <text x="1220" y="700" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">10 / 12</text>
  </g>
</svg>
