<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowHeadDashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/>
    </marker>
  </defs>

  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30" font-weight="bold" fill="#111827">Router + per-GPU engines + shared shm checkpoint store</text>
    <line x1="60" y1="105" x2="1220" y2="105" stroke="#D1D5DB" stroke-width="1"/>
    <text x="60" y="135" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="16" fill="#4B5563">Same checkpoint data backs both same-engine preempt-and-resume and cross-engine recovery.</text>
  </g>

  <g id="arch-client">
    <rect x="80" y="290" width="120" height="60" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="140" y="325" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-weight="bold" fill="#111827">Client</text>
  </g>

  <line x1="200" y1="320" x2="290" y2="320" stroke="#111827" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <g id="arch-router">
    <!-- icon: tabler-outline/router -->
  <g transform="translate(305.0, 232.0)" fill="none" stroke="#111827" stroke-width="2">
    <path d="M3 15a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -4" />
    <path d="M17 17l0 .01" />
    <path d="M13 17l0 .01" />
    <path d="M15 13l0 -2" />
    <path d="M11.75 8.75a4 4 0 0 1 6.5 0" />
    <path d="M8.5 6.5a8 8 0 0 1 13 0" />
  </g>
    <text x="365" y="250" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="12" letter-spacing="1.5" fill="#9CA3AF">CPU-ONLY PROCESS</text>
    <rect x="300" y="270" width="180" height="100" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="390" y="305" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">Router</text>
    <text x="390" y="330" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">load balance · health watch</text>
    <text x="390" y="350" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">reroute on engine death</text>
  </g>

  <line x1="480" y1="295" x2="640" y2="220" stroke="#111827" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="480" y1="340" x2="640" y2="420" stroke="#111827" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <g id="arch-engine-0">
    <!-- icon: tabler-outline/cpu -->
  <g transform="translate(660.0, 180.0) scale(0.9166666666666666)" fill="none" stroke="#111827" stroke-width="2">
    <path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12" />
    <path d="M9 9h6v6h-6l0 -6" />
    <path d="M3 10h2" />
    <path d="M3 14h2" />
    <path d="M10 3v2" />
    <path d="M14 3v2" />
    <path d="M21 10h-2" />
    <path d="M21 14h-2" />
    <path d="M14 21v-2" />
    <path d="M10 21v-2" />
  </g>
    <text x="710" y="198" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="12" letter-spacing="1.5" fill="#9CA3AF">GPU 0</text>
    <rect x="655" y="210" width="240" height="100" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="775" y="240" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">Engine 0</text>
    <text x="775" y="265" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">vLLM step loop</text>
    <text x="775" y="285" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">slack-based scheduler hook</text>
  </g>

  <g id="arch-engine-1">
    <!-- icon: tabler-outline/cpu -->
  <g transform="translate(660.0, 395.0) scale(0.9166666666666666)" fill="none" stroke="#111827" stroke-width="2">
    <path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12" />
    <path d="M9 9h6v6h-6l0 -6" />
    <path d="M3 10h2" />
    <path d="M3 14h2" />
    <path d="M10 3v2" />
    <path d="M14 3v2" />
    <path d="M21 10h-2" />
    <path d="M21 14h-2" />
    <path d="M14 21v-2" />
    <path d="M10 21v-2" />
  </g>
    <text x="710" y="413" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="12" letter-spacing="1.5" fill="#9CA3AF">GPU 1</text>
    <rect x="655" y="425" width="240" height="100" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="775" y="455" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" font-weight="bold" fill="#111827">Engine 1</text>
    <text x="775" y="480" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">vLLM step loop</text>
    <text x="775" y="500" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">slack-based scheduler hook</text>
  </g>

  <line x1="895" y1="260" x2="1015" y2="320" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHeadDashed)"/>
  <line x1="895" y1="475" x2="1015" y2="410" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHeadDashed)"/>
  <line x1="1140" y1="320" x2="1140" y2="410" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="1015" y1="350" x2="895" y2="280" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHeadDashed)"/>
  <line x1="1015" y1="380" x2="895" y2="455" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHeadDashed)"/>

  <g id="arch-shm">
    <!-- icon: tabler-outline/database -->
  <g transform="translate(1020.0, 305.0) scale(0.9166666666666666)" fill="none" stroke="#111827" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
    <text x="1075" y="323" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="12" letter-spacing="1.5" fill="#9CA3AF">HOST RAM</text>
    <rect x="1015" y="335" width="190" height="80" fill="#F3F4F6" stroke="#111827" stroke-width="1.5"/>
    <text x="1110" y="365" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" font-weight="bold" fill="#111827">/dev/shm</text>
    <text x="1110" y="385" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">KV checkpoint mirror</text>
    <text x="1110" y="403" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" fill="#4B5563">+ engine status files</text>
  </g>

  <g id="legend">
    <line x1="80" y1="555" x2="120" y2="555" stroke="#111827" stroke-width="1.5"/>
    <text x="130" y="560" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">request flow</text>
    <line x1="280" y1="555" x2="320" y2="555" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="330" y="560" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">checkpoint publish / restore</text>
  </g>

  <g id="takeaways">
    <line x1="60" y1="600" x2="1220" y2="600" stroke="#D1D5DB" stroke-width="1"/>
    <text x="80" y="635" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">·  Two tiers under <tspan font-family="Consolas, &quot;Courier New&quot;, monospace">/dev/shm</tspan>: in-process <tspan font-style="italic">pinned-memory pool</tspan> for same-engine resume + shm mirror for cross-engine restore.</text>
    <text x="80" y="660" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">·  Router watches engine health via shm status file (heartbeat thread, polled every 500 ms); reroute on death.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">Disruption-Aware SLO Scheduling — APSys 2026 draft</text>
    <text x="1220" y="700" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">06 / 12</text>
  </g>
</svg>
