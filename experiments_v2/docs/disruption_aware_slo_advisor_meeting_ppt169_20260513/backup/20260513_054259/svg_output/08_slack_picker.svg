<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30" font-weight="bold" fill="#111827">Pick laziest tail, admit most urgent head — measurement, not prediction</text>
    <line x1="60" y1="105" x2="1220" y2="105" stroke="#D1D5DB" stroke-width="1"/>
    <text x="60" y="135" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="16" fill="#4B5563">Slack is computed from runtime measurements — no offline-profiled latency model.</text>
  </g>

  <g id="slack-definition">
    <use data-icon="tabler-outline/hourglass" x="60" y="173" width="24" height="24" fill="#111827"/>
    <text x="95" y="192" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">DEFINITION</text>

    <text x="60" y="225" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="20" fill="#111827">slack(r, t)  =  wall-clock remaining before request r misses its SLO</text>

    <line x1="60" y1="250" x2="610" y2="250" stroke="#D1D5DB" stroke-width="1"/>

    <text x="60" y="285" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" letter-spacing="1.5" fill="#9CA3AF">PRE-FIRST-TOKEN</text>
    <text x="60" y="315" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" fill="#111827">slack = S_TTFT − elapsed_since_arrival</text>

    <text x="60" y="365" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" letter-spacing="1.5" fill="#9CA3AF">POST-FIRST-TOKEN</text>
    <text x="60" y="395" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" fill="#111827">slack = S_TPOT − avg_per_token_so_far</text>

    <line x1="60" y1="430" x2="610" y2="430" stroke="#D1D5DB" stroke-width="1"/>

    <text x="60" y="465" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">Both SLOs collapse into one comparable signal.</text>
    <text x="60" y="490" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">Picker walks running &amp; waiting queues each step:</text>
    <text x="60" y="525" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">·  victim ←  <tspan font-weight="bold">max slack</tspan> in running (most relaxed)</text>
    <text x="60" y="552" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">·  head   ←  <tspan font-weight="bold">min slack</tspan> in waiting (most urgent)</text>

    <text x="60" y="615" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Defaults: <tspan font-family="Consolas, &quot;Courier New&quot;, monospace">δ = 1 s</tspan>, <tspan font-family="Consolas, &quot;Courier New&quot;, monospace">cooldown = 5 s</tspan></text>
    <text x="60" y="638" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">— tuned on E_M2 budget, stable across our sweeps.</text>
  </g>

  <g id="separator">
    <line x1="660" y1="170" x2="660" y2="650" stroke="#D1D5DB" stroke-width="1"/>
  </g>

  <g id="picker-rule">
    <text x="690" y="192" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">PICKER RULE — PREEMPT IFF</text>

    <rect x="690" y="210" width="530" height="115" fill="#F3F4F6"/>
    <text x="705" y="240" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" fill="#111827">slack(victim) − slack(head)  &gt;  δ + replay_cost(victim)</text>
    <text x="705" y="266" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" fill="#111827"><tspan font-weight="bold">AND</tspan>  num_checkpointed_tokens(victim) &gt; 0</text>
    <text x="705" y="293" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" fill="#111827"><tspan font-weight="bold">AND</tspan>  time_since_last_preempt(victim) &gt; cooldown</text>
    <text x="705" y="316" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="12" fill="#4B5563">replay_cost = extra TPOT × tokens new engine recomputes</text>

    <text x="690" y="375" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">THREE GUARDS — EACH KILLS ONE FAILURE MODE</text>
    <line x1="690" y1="385" x2="1220" y2="385" stroke="#111827" stroke-width="1"/>

    <g id="guard-1">
      <text x="690" y="420" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="18" fill="#111827">1.</text>
      <text x="720" y="420" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-weight="bold" fill="#111827">Hysteresis δ</text>
      <text x="720" y="445" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">blocks back-and-forth thrashing on similar-slack pairs.</text>
    </g>

    <g id="guard-2">
      <text x="690" y="485" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="18" fill="#111827">2.</text>
      <text x="720" y="485" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-weight="bold" fill="#111827">replay_cost(victim)</text>
      <text x="720" y="510" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">ensures only favorable trades fire — net slack must go up.</text>
    </g>

    <g id="guard-3">
      <text x="690" y="550" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="18" fill="#111827">3.</text>
      <text x="720" y="550" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-weight="bold" fill="#111827">cooldown</text>
      <text x="720" y="575" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">prevents reprocessing the same victim every step.</text>
    </g>

    <line x1="690" y1="615" x2="1220" y2="615" stroke="#D1D5DB" stroke-width="1"/>
    <text x="690" y="645" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="14" fill="#4B5563">Where prior work used offline gates (Scorpio α/β/γ/δ, JITServe v_token,</text>
    <text x="690" y="665" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="14" fill="#4B5563">Llumnix headroom), we observe slack drift at runtime and correct reactively.</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">Disruption-Aware SLO Scheduling — APSys 2026 draft</text>
    <text x="1220" y="700" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">08 / 12</text>
  </g>
</svg>
