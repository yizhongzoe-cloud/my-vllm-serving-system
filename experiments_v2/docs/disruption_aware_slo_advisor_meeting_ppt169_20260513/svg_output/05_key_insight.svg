<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="eyebrow">
    <text x="640" y="170" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" letter-spacing="3" fill="#9CA3AF">KEY INSIGHT</text>
    <line x1="600" y1="195" x2="680" y2="195" stroke="#111827" stroke-width="1"/>
  </g>

  <g id="insight-headline">
    <text x="640" y="285" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="42" font-weight="bold" fill="#111827">One mechanism. Two uses.</text>
  </g>

  <g id="insight-body">
    <text x="640" y="365" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="22" fill="#111827">A single host-side KV checkpoint, async-published to <tspan font-family="Consolas, &quot;Courier New&quot;, monospace" font-style="normal" font-size="20">/dev/shm</tspan> at block-aligned cadence,</text>
    <text x="640" y="397" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="22" fill="#111827">simultaneously serves as</text>
  </g>

  <g id="two-uses">
    <g id="use-i">
      <text x="220" y="465" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28" font-style="italic" fill="#111827">(i)</text>
      <text x="280" y="465" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="bold" fill="#111827">recovery substrate</text>
      <text x="280" y="492" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" fill="#4B5563">when an engine dies — peer reads checkpoint,</text>
      <text x="280" y="514" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" fill="#4B5563">resumes decode without reprefill</text>
    </g>

    <g id="use-ii">
      <text x="700" y="465" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="28" font-style="italic" fill="#111827">(ii)</text>
      <text x="765" y="465" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="bold" fill="#111827">cheap-preempt substrate</text>
      <text x="765" y="492" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" fill="#4B5563">scheduler can preempt running long-context</text>
      <text x="765" y="514" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="17" fill="#4B5563">decode without wasting prefill</text>
    </g>
  </g>

  <g id="closing">
    <line x1="540" y1="585" x2="740" y2="585" stroke="#D1D5DB" stroke-width="1"/>
    <text x="640" y="625" text-anchor="middle" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-style="italic" font-size="20" fill="#4B5563">Same data. Two uses. No duplication.</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">Disruption-Aware SLO Scheduling — APSys 2026 draft</text>
    <text x="1220" y="690" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">05 / 12</text>
  </g>
</svg>
