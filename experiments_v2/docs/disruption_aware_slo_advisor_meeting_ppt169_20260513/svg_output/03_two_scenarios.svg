<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="60" y="80" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30" font-weight="bold" fill="#111827">Two scenarios share the same root cause: no cheap resume</text>
    <line x1="60" y1="105" x2="1220" y2="105" stroke="#D1D5DB" stroke-width="1"/>
    <text x="60" y="135" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-style="italic" font-size="16" fill="#4B5563">Both end the same way today — recompute the prefill from scratch.</text>
  </g>

  <line x1="640" y1="170" x2="640" y2="640" stroke="#D1D5DB" stroke-width="1"/>

  <g id="left-engine-death">
    <use data-icon="tabler-outline/skull" x="100" y="180" width="32" height="32" fill="#111827"/>
    <text x="145" y="205" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="2" fill="#9CA3AF">SCENARIO A</text>
    <text x="100" y="245" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="24" font-weight="bold" fill="#111827">Engine failure mid-decode</text>

    <g id="left-bullets">
      <line x1="100" y1="280" x2="600" y2="280" stroke="#D1D5DB" stroke-width="1"/>

      <text x="100" y="320" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">A long request lives on one GPU.</text>
      <text x="100" y="345" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">That GPU disappears.</text>

      <text x="100" y="395" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Causes: hardware fault · OOM · scheduled drain ·</text>
      <text x="100" y="415" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">container kill · multi-tenant preemption.</text>

      <text x="100" y="465" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827"><tspan font-weight="bold">Long requests are disproportionately exposed</tspan></text>
      <text x="100" y="490" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">— lifetime ∝ disruption probability.</text>

      <text x="100" y="555" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">RECOVERY TODAY</text>
      <line x1="100" y1="565" x2="600" y2="565" stroke="#111827" stroke-width="1"/>
      <text x="100" y="595" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">Full reprefill on a surviving engine.</text>
      <text x="100" y="618" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-style="italic" fill="#4B5563">→ tens of seconds at 16K context.</text>
    </g>
  </g>

  <g id="right-priority-preempt">
    <use data-icon="tabler-outline/bolt" x="680" y="180" width="32" height="32" fill="#111827"/>
    <text x="725" y="205" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="2" fill="#9CA3AF">SCENARIO B</text>
    <text x="680" y="245" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="24" font-weight="bold" fill="#111827">Priority preempt mid-decode</text>

    <g id="right-bullets">
      <line x1="680" y1="280" x2="1220" y2="280" stroke="#D1D5DB" stroke-width="1"/>

      <text x="680" y="320" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">A tight-SLO request arrives.</text>
      <text x="680" y="345" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">Its deadline is closer than the running request's.</text>

      <text x="680" y="395" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">Routine under any non-uniform workload —</text>
      <text x="680" y="415" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="14" fill="#4B5563">tight requests landing during loose decode.</text>

      <text x="680" y="465" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827"><tspan font-weight="bold">Schedulers refuse to preempt long-context decode</tspan></text>
      <text x="680" y="490" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="18" fill="#111827">— reprefill cost &gt; priority benefit.</text>

      <text x="680" y="555" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="13" letter-spacing="1.5" fill="#9CA3AF">OUTCOME TODAY</text>
      <line x1="680" y1="565" x2="1220" y2="565" stroke="#111827" stroke-width="1"/>
      <text x="680" y="595" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" fill="#111827">Tight request waits, often misses SLO.</text>
      <text x="680" y="618" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="16" font-style="italic" fill="#4B5563">→ priority signal becomes advisory only.</text>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">Disruption-Aware SLO Scheduling — APSys 2026 draft</text>
    <text x="1220" y="690" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="11" fill="#9CA3AF">03 / 12</text>
  </g>
</svg>
