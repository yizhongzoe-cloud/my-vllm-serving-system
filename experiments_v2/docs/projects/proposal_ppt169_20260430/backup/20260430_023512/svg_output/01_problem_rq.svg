<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="80" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="32" font-weight="bold" fill="#000000">Long-context RAG serving has a recovery problem</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Top half: motivation -->
  <text x="60" y="155" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="22" font-weight="bold" fill="#000000">The problem</text>

  <g font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#374151">
    <text x="60" y="195" text-anchor="start">•  Production LLM serving now sees 32K–128K-token prompts (long-context RAG).</text>
    <text x="60" y="225" text-anchor="start">•  When an engine dies mid-run, you lose 20–90 seconds of prefill per request.</text>
    <text x="60" y="255" text-anchor="start">•  Re-running prefill on a surviving engine blows past any reasonable TTFT SLO.</text>
    <text x="60" y="285" text-anchor="start">•  FT systems (Mooncake) and SLO-aware schedulers (QLM, Scorpio, JITServe, SLOs-Serve)</text>
    <text x="78" y="311" text-anchor="start">don&apos;t talk to each other.</text>
    <text x="60" y="365" text-anchor="start" font-weight="bold" fill="#000000">•  But here is the thing.</text>
    <text x="78" y="395" text-anchor="start">FT keeps a copy of every request&apos;s KV state in host memory for crash recovery.</text>
    <text x="78" y="421" text-anchor="start">That copy is exactly what an SLO scheduler needs to preempt long-context cheaply.</text>
    <text x="78" y="447" text-anchor="start">Nobody has connected the two.</text>
  </g>

  <!-- Bottom: Research Question box with red left border -->
  <rect x="60" y="490" width="1160" height="160" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="60" y="490" width="6" height="160" fill="#DC2626"/>

  <text x="90" y="528" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="22" font-weight="bold" fill="#000000">Research Question</text>

  <text x="90" y="568" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#374151">Can the same KV-state copy do double duty —</text>
  <text x="90" y="598" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#374151">fast restore after a crash, AND cheap preemption during normal serving?</text>
  <text x="90" y="628" text-anchor="start" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#6B7280">Especially when the post-fault path is busy and a fast restore alone can&apos;t hide the queueing.</text>

  <!-- Footer -->
  <text x="1220" y="700" text-anchor="end" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="14" fill="#6B7280">p.1 / 3</text>
</svg>
