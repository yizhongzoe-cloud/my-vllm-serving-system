<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="80" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="32" font-weight="bold" fill="#000000">Long-context RAG serving has a recovery problem</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Top half: motivation bullets -->
  <text x="60" y="155" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="22" font-weight="bold" fill="#000000">Motivation</text>

  <g font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#374151">
    <text x="60" y="195">
      <tspan x="60" dy="0">•  Long-context RAG (32K–128K tokens) is now production-common in LLM serving</tspan>
    </text>
    <text x="60" y="225">
      <tspan x="60" dy="0">•  A mid-run engine failure forfeits </tspan><tspan font-weight="bold" fill="#DC2626">20–90 seconds</tspan><tspan> of prefill compute per request</tspan>
    </text>
    <text x="60" y="255">
      <tspan x="60" dy="0">•  Naive re-prefill on a surviving replica cannot meet reasonable TTFT SLOs</tspan>
    </text>
    <text x="60" y="285">
      <tspan x="60" dy="0">•  Existing FT systems (Mooncake) and SLO-aware schedulers (QLM, Scorpio, JITServe,</tspan>
      <tspan x="60" dy="26">   SLOs-Serve) work in isolation — neither shares state with the other</tspan>
    </text>
    <text x="60" y="365">
      <tspan x="60" dy="0">•  </tspan><tspan font-weight="bold" fill="#000000">Hidden opportunity:</tspan><tspan> the host-memory KV state maintained for FT recovery is</tspan>
      <tspan x="60" dy="26">   exactly what an SLO-aware scheduler needs to preempt long-context requests cheaply</tspan>
    </text>
  </g>

  <!-- Bottom: Research Question box with red left border -->
  <rect x="60" y="470" width="1160" height="180" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="60" y="470" width="6" height="180" fill="#DC2626"/>

  <text x="90" y="510" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="22" font-weight="bold" fill="#000000">Research Question</text>

  <text x="90" y="548" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="18" fill="#374151">
    <tspan x="90" dy="0">Can the host-memory KV state maintained for fault recovery serve as a </tspan><tspan font-weight="bold" font-style="italic" fill="#DC2626">dual-purpose primitive</tspan><tspan> —</tspan>
    <tspan x="90" dy="28">enabling both fast restore after failure </tspan><tspan font-weight="bold" fill="#000000">and</tspan><tspan> cheap preemption of in-flight long-context</tspan>
    <tspan x="90" dy="28">requests during normal operation?</tspan>
  </text>

  <!-- Footer: page number -->
  <text x="1220" y="700" font-family='Arial, "Microsoft YaHei", sans-serif' font-size="14" fill="#6B7280" text-anchor="end">p.1 / 3</text>
</svg>
