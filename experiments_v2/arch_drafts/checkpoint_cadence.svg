<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5282"/></marker>
  </defs>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Per-block KV checkpoint · two-tier host store</text>

  <!-- GPU KV lane -->
  <rect x="40" y="58" width="700" height="84" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="56" y="78" font-weight="600" fill="#2b4365">GPU KV cache (one engine)</text>
  <text x="56" y="94" font-size="11" fill="#2b4365">decode advances 16 tokens at a time = one vLLM KV block</text>

  <!-- block tiles -->
  <rect x="60" y="108" width="92" height="24" rx="3" fill="#fff" stroke="#2b6cb0"/>
  <text x="106" y="124" text-anchor="middle" font-size="11" fill="#2b4365">block 0 · 16 tok</text>
  <rect x="156" y="108" width="92" height="24" rx="3" fill="#fff" stroke="#2b6cb0"/>
  <text x="202" y="124" text-anchor="middle" font-size="11" fill="#2b4365">block 1 · 16 tok</text>
  <rect x="252" y="108" width="92" height="24" rx="3" fill="#fff" stroke="#2b6cb0"/>
  <text x="298" y="124" text-anchor="middle" font-size="11" fill="#2b4365">block 2 · 16 tok</text>
  <rect x="348" y="108" width="92" height="24" rx="3" fill="#fff" stroke="#2b6cb0"/>
  <text x="394" y="124" text-anchor="middle" font-size="11" fill="#2b4365">block 3 · 16 tok</text>
  <rect x="444" y="108" width="92" height="24" rx="3" fill="#fff" stroke="#2b6cb0"/>
  <text x="490" y="124" text-anchor="middle" font-size="11" fill="#2b4365">block 4 · 16 tok</text>
  <text x="552" y="124" font-size="13" fill="#2b4365">⋯</text>

  <!-- arrows down: after each block boundary, async save -->
  <line x1="106" y1="142" x2="106" y2="184" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="202" y1="142" x2="202" y2="184" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="298" y1="142" x2="298" y2="184" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="394" y1="142" x2="394" y2="184" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="490" y1="142" x2="490" y2="184" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="630" y="166" font-size="11" fill="#666" font-style="italic">async save</text>
  <text x="630" y="180" font-size="11" fill="#666" font-style="italic">(per-block delta)</text>

  <!-- L1 host pinned -->
  <rect x="40" y="186" width="700" height="58" rx="6" fill="#fde7c4" stroke="#c05621" stroke-width="1.5"/>
  <text x="56" y="206" font-weight="600" fill="#7b341e">L1 · Host pinned memory (per-engine staging)</text>
  <text x="56" y="222" font-size="11" fill="#7b341e">sub-ms read · feeds same-engine resume directly</text>
  <text x="56" y="237" font-size="11" fill="#7b341e">holds K/V of newly-stable blocks only, not full KV history</text>

  <!-- arrow L1 -> L2 (publish) -->
  <line x1="390" y1="246" x2="390" y2="288" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="398" y="270" font-size="11" fill="#666" font-style="italic">publish</text>

  <!-- L2 shared host store -->
  <rect x="40" y="290" width="700" height="86" rx="6" fill="#c6e8d0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="56" y="310" font-weight="600" fill="#22543d">L2 · Shared host store (cross-engine readable)</text>
  <text x="56" y="326" font-size="11" fill="#22543d">indexed by (req_id, block_id) · same data as L1, different access path</text>

  <!-- pool entries hint -->
  <rect x="60" y="338" width="120" height="22" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="120" y="353" text-anchor="middle" font-size="10" fill="#22543d">R1 KV [0..511]</text>
  <rect x="190" y="338" width="120" height="22" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="250" y="353" text-anchor="middle" font-size="10" fill="#22543d">R7 KV [0..2750]</text>
  <rect x="320" y="338" width="120" height="22" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="380" y="353" text-anchor="middle" font-size="10" fill="#22543d">R2 KV [0..127]</text>
  <text x="450" y="353" font-size="11" fill="#22543d">…</text>

  <!-- peer engines read arrow out -->
  <line x1="660" y1="332" x2="730" y2="332" stroke="#2c5282" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="660" y="320" font-size="10" fill="#2c5282" font-weight="600">peer engines read</text>
  <text x="660" y="368" font-size="10" fill="#2c5282" font-style="italic">(recovery / preempt resume)</text>

  <!-- bottom callout: healthy-load tax -->
  <rect x="40" y="392" width="700" height="36" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="56" y="414" font-size="12" fill="#1a202c"><tspan font-weight="700">Healthy-load tax:</tspan> +~30 ms TTFT P50 vs no-FT baseline · throughput within 0.5%</text>
</svg>
