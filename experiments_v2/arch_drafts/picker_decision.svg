<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
  </defs>

  <!-- slack axis -->
  <line x1="100" y1="220" x2="720" y2="220" stroke="#4a5568" stroke-width="1.2" marker-end="url(#ak)"/>
  <text x="728" y="224" font-size="11" fill="#4a5568">slack (s)</text>

  <!-- ticks -->
  <g font-size="10" fill="#4a5568">
    <line x1="100" y1="216" x2="100" y2="224" stroke="#4a5568"/>
    <text x="100" y="238" text-anchor="middle">0</text>
    <line x1="220" y1="216" x2="220" y2="224" stroke="#4a5568"/>
    <text x="220" y="238" text-anchor="middle">0.5</text>
    <line x1="340" y1="216" x2="340" y2="224" stroke="#4a5568"/>
    <text x="340" y="238" text-anchor="middle">1.0</text>
    <line x1="460" y1="216" x2="460" y2="224" stroke="#4a5568"/>
    <text x="460" y="238" text-anchor="middle">1.5</text>
    <line x1="580" y1="216" x2="580" y2="224" stroke="#4a5568"/>
    <text x="580" y="238" text-anchor="middle">2.0</text>
    <line x1="700" y1="216" x2="700" y2="224" stroke="#4a5568"/>
    <text x="700" y="238" text-anchor="middle">2.5</text>
  </g>

  <!-- urgency labels -->
  <text x="100" y="200" font-size="10" fill="#c53030" font-style="italic">urgent</text>
  <text x="720" y="200" text-anchor="end" font-size="10" fill="#22543d" font-style="italic">relaxed</text>

  <!-- waiting queue label -->
  <text x="32" y="100" font-size="11" font-weight="600" fill="#553c9a">Waiting</text>

  <!-- waiting requests -->
  <circle cx="148" cy="120" r="20" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="148" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#742a2a">R_u</text>
  <text x="148" y="130" text-anchor="middle" font-size="9" fill="#742a2a">0.2 s</text>
  <text x="148" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#c53030">head = argmin slack</text>
  <line x1="148" y1="140" x2="148" y2="220" stroke="#c53030" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

  <circle cx="268" cy="120" r="14" fill="#fff" stroke="#6b46c1"/>
  <text x="268" y="118" text-anchor="middle" font-size="10" fill="#553c9a">R_b</text>
  <text x="268" y="130" text-anchor="middle" font-size="9" fill="#553c9a">0.7</text>

  <circle cx="364" cy="120" r="14" fill="#fff" stroke="#6b46c1"/>
  <text x="364" y="118" text-anchor="middle" font-size="10" fill="#553c9a">R_c</text>
  <text x="364" y="130" text-anchor="middle" font-size="9" fill="#553c9a">1.1</text>

  <!-- running queue label -->
  <text x="32" y="340" font-size="11" font-weight="600" fill="#2b4365">Running</text>

  <circle cx="292" cy="340" r="14" fill="#fff" stroke="#2b6cb0"/>
  <text x="292" y="338" text-anchor="middle" font-size="10" fill="#2b4365">R_a</text>
  <text x="292" y="350" text-anchor="middle" font-size="9" fill="#2b4365">0.8</text>

  <circle cx="412" cy="340" r="14" fill="#fff" stroke="#2b6cb0"/>
  <text x="412" y="338" text-anchor="middle" font-size="10" fill="#2b4365">R_d</text>
  <text x="412" y="350" text-anchor="middle" font-size="9" fill="#2b4365">1.3</text>

  <circle cx="580" cy="340" r="20" fill="#c6e8d0" stroke="#2f855a" stroke-width="2"/>
  <text x="580" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">R_v</text>
  <text x="580" y="350" text-anchor="middle" font-size="9" fill="#22543d">2.0 s</text>
  <text x="580" y="378" text-anchor="middle" font-size="10" font-weight="700" fill="#22543d">victim = argmax slack</text>
  <line x1="580" y1="320" x2="580" y2="220" stroke="#22543d" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- gap bracket -->
  <line x1="148" y1="178" x2="580" y2="178" stroke="#1a202c" stroke-width="1.2"/>
  <line x1="148" y1="178" x2="148" y2="188" stroke="#1a202c" stroke-width="1.2"/>
  <line x1="580" y1="178" x2="580" y2="188" stroke="#1a202c" stroke-width="1.2"/>
  <text x="364" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#1a202c">gap = slack(R_v) − slack(R_u)</text>

  <!-- five guards bar -->
  <text x="400" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#744210">Preempt R_v in favor of R_u iff all five guards hold</text>

  <g font-size="11" fill="#744210">
    <rect x="40"  y="424" width="140" height="40" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.2"/>
    <text x="110" y="441" text-anchor="middle" font-weight="700">1. slack-gap</text>
    <text x="110" y="457" text-anchor="middle" font-size="10">gap &gt; replay cost</text>

    <rect x="190" y="424" width="140" height="40" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.2"/>
    <text x="260" y="441" text-anchor="middle" font-weight="700">2. manifest</text>
    <text x="260" y="457" text-anchor="middle" font-size="10">checkpoint on shm</text>

    <rect x="340" y="424" width="140" height="40" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.2"/>
    <text x="410" y="441" text-anchor="middle" font-weight="700">3. head-danger</text>
    <text x="410" y="457" text-anchor="middle" font-size="10">R_u near deadline</text>

    <rect x="490" y="424" width="140" height="40" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.2"/>
    <text x="560" y="441" text-anchor="middle" font-weight="700">4. peer-capacity</text>
    <text x="560" y="457" text-anchor="middle" font-size="10">spare engine alive</text>

    <rect x="640" y="424" width="120" height="40" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.2"/>
    <text x="700" y="441" text-anchor="middle" font-weight="700">5. cooldown</text>
    <text x="700" y="457" text-anchor="middle" font-size="10">5 s elapsed</text>
  </g>
</svg>
