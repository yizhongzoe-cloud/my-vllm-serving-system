<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5282"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
  </defs>

  <!-- client -->
  <rect x="50" y="30" width="160" height="46" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.2"/>
  <text x="130" y="50" text-anchor="middle" font-weight="600" fill="#1a202c">Client</text>
  <text x="130" y="66" text-anchor="middle" font-size="10" fill="#4a5568">/v1/completions</text>

  <!-- router -->
  <rect x="240" y="30" width="490" height="78" rx="6" fill="#e2d8f3" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="258" y="52" font-weight="600" fill="#44337a">Router (CPU process)</text>
  <text x="258" y="70" font-size="11" fill="#553c9a">dispatches requests by load · polls engine status files · reroutes in-flight requests on engine failure</text>
  <text x="258" y="88" font-size="10" fill="#553c9a" font-style="italic">stateless control plane · no GPU</text>

  <!-- client -> router -->
  <line x1="210" y1="53" x2="238" y2="53" stroke="#1a202c" stroke-width="1.2" marker-end="url(#ak)"/>

  <!-- engines -->
  <g>
    <rect x="50" y="150" width="330" height="140" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="215" y="172" text-anchor="middle" font-weight="600" fill="#2b4365">Engine A (GPU)</text>
    <text x="215" y="190" text-anchor="middle" font-size="11" fill="#2b4365">vLLM execution loop · slack picker · heartbeat thread</text>
    <text x="68" y="212" font-size="11" fill="#2b4365">R1 long-context decode (slack 0.2 s, tight SLO)</text>
    <text x="68" y="228" font-size="11" fill="#2b4365">R7 long-context decode (slack 1.5 s, loose)</text>
    <rect x="68" y="244" width="294" height="22" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <rect x="68" y="244" width="190" height="22" rx="3" fill="#2b6cb0"/>
    <text x="215" y="259" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">GPU KV cache · block_size = 16 tok</text>
    <text x="215" y="282" text-anchor="middle" font-size="10" fill="#c53030" font-weight="600">candidate for preempt: R7 has slack</text>
  </g>
  <g>
    <rect x="400" y="150" width="330" height="140" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="565" y="172" text-anchor="middle" font-weight="600" fill="#2b4365">Engine B (GPU)</text>
    <text x="565" y="190" text-anchor="middle" font-size="11" fill="#2b4365">vLLM execution loop · slack picker · heartbeat thread</text>
    <text x="418" y="212" font-size="11" fill="#2b4365">R2 short-context decode</text>
    <text x="418" y="228" font-size="11" fill="#2b4365">spare capacity available</text>
    <rect x="418" y="244" width="294" height="22" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <rect x="418" y="244" width="80" height="22" rx="3" fill="#2b6cb0"/>
    <text x="565" y="259" text-anchor="middle" font-size="10" fill="#1a202c" font-weight="600">GPU KV cache · block_size = 16 tok</text>
    <text x="565" y="282" text-anchor="middle" font-size="10" fill="#22543d" font-weight="600">target for preempt resume or recovery</text>
  </g>

  <!-- dispatch arrows -->
  <line x1="430" y1="108" x2="215" y2="148" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <line x1="540" y1="108" x2="565" y2="148" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <text x="312" y="130" font-size="10" fill="#1a202c">dispatch</text>

  <!-- host memory -->
  <rect x="50" y="328" width="680" height="50" rx="6" fill="#fde7c4" stroke="#c05621" stroke-width="1.5"/>
  <text x="68" y="350" font-weight="600" fill="#7b341e">Host pinned memory · in-process checkpoint pool</text>
  <text x="68" y="366" font-size="11" fill="#7b341e">D2H copy every 16 generated tokens, dedicated CUDA stream, overlaps decode</text>

  <!-- ckpt arrows engines -> host -->
  <line x1="215" y1="290" x2="215" y2="326" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="565" y1="290" x2="565" y2="326" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="222" y="310" font-size="10" fill="#666">checkpoint write</text>

  <!-- shm -->
  <rect x="50" y="408" width="680" height="76" rx="6" fill="#c6e8d0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="68" y="430" font-weight="600" fill="#22543d">Shared host-memory store (cross-engine, mmap, zero-copy reads)</text>
  <text x="68" y="448" font-size="11" fill="#22543d">indexed by (req_id, block_id) · also holds engine status records and reroute coordination metadata</text>
  <rect x="68" y="456" width="120" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="128" y="470" text-anchor="middle" font-size="10" fill="#22543d">R1 [0..511]</text>
  <rect x="198" y="456" width="120" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="258" y="470" text-anchor="middle" font-size="10" fill="#22543d">R7 [0..2750]</text>
  <rect x="328" y="456" width="120" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="388" y="470" text-anchor="middle" font-size="10" fill="#22543d">R2 [0..127]</text>
  <rect x="458" y="456" width="160" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="538" y="470" text-anchor="middle" font-size="10" fill="#22543d">R8 preempted [0..900]</text>
  <text x="628" y="470" font-size="10" fill="#22543d">...</text>

  <!-- host -> shm publish -->
  <line x1="390" y1="378" x2="390" y2="406" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="397" y="396" font-size="10" fill="#666">publish</text>

  <!-- router status poll: shm engine_status -> router -->
  <path d="M 660 420 Q 750 420 750 80 Q 750 50 730 50" fill="none" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)" opacity="0.7"/>
  <text x="694" y="240" font-size="10" fill="#6b46c1" transform="rotate(-90 694 240)">heartbeat / status</text>

  <!-- recovery flow: shm -> Engine B (cross-engine reroute on Engine A death) -->
  <path d="M 130 478 Q 30 478 30 220 Q 30 178 50 178 L 50 178" fill="none" stroke="#c53030" stroke-width="1.6" marker-end="url(#ar)" opacity="0.0"/>

  <!-- preempt resume flow: shm -> any engine (here B) blue -->
  <path d="M 538 478 Q 538 504 415 504 Q 380 504 380 220 Q 380 148 400 148" fill="none" stroke="#2c5282" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ab)" opacity="0.75"/>
  <text x="420" y="500" font-size="11" fill="#2c5282" font-weight="600">restore on resume / reroute</text>

  <!-- legend -->
  <g transform="translate(0,0)">
    <line x1="50" y1="118" x2="80" y2="118" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="86" y="122" font-size="10" fill="#1a202c">KV checkpoint path</text>
    <line x1="222" y1="118" x2="252" y2="118" stroke="#2c5282" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="258" y="122" font-size="10" fill="#1a202c">cheap-preempt or cross-engine restore</text>
    <line x1="498" y1="118" x2="528" y2="118" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="534" y="122" font-size="10" fill="#1a202c">router health polling</text>
  </g>
</svg>
