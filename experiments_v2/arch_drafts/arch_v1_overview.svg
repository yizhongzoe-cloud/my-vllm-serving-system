<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5282"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
  </defs>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Host-side KV checkpoint enables cheap preempt + recovery</text>

  <!-- scheduler -->
  <rect x="50" y="50" width="680" height="84" rx="6" fill="#e2d8f3" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="68" y="74" font-weight="600" fill="#44337a">Scheduler · slack-priority queue</text>
  <text x="68" y="92" font-size="11" fill="#553c9a">priority = deadline − ETA. lowest-slack request runs next; running request with slack to spare may be preempted.</text>
  <rect x="360" y="102" width="78" height="22" rx="11" fill="#fff" stroke="#6b46c1"/>
  <text x="399" y="117" text-anchor="middle" font-size="11" fill="#553c9a">R3 · 0.2s</text>
  <rect x="448" y="102" width="78" height="22" rx="11" fill="#fff" stroke="#6b46c1"/>
  <text x="487" y="117" text-anchor="middle" font-size="11" fill="#553c9a">R4 · 0.5s</text>
  <rect x="536" y="102" width="78" height="22" rx="11" fill="#fff" stroke="#6b46c1"/>
  <text x="575" y="117" text-anchor="middle" font-size="11" fill="#553c9a">R5 · 1.2s</text>
  <rect x="624" y="102" width="90" height="22" rx="11" fill="#fff" stroke="#6b46c1"/>
  <text x="669" y="117" text-anchor="middle" font-size="11" fill="#553c9a">R6 · 2.0s ...</text>

  <!-- engines -->
  <g>
    <rect x="70" y="180" width="200" height="96" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="170" y="202" text-anchor="middle" font-weight="600" fill="#2b4365">Engine A (GPU)</text>
    <text x="170" y="220" text-anchor="middle" font-size="11" fill="#2b4365">R1 long-context prefill</text>
    <rect x="92" y="232" width="156" height="20" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <rect x="92" y="232" width="40" height="20" rx="3" fill="#2b6cb0"/>
    <text x="170" y="246" text-anchor="middle" font-size="10" fill="#1a202c">GPU KV  (8k / 64k tok)</text>
    <text x="170" y="266" text-anchor="middle" font-size="10" fill="#718096">block_size = 16 tok</text>
  </g>
  <g>
    <rect x="290" y="180" width="200" height="96" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="390" y="202" text-anchor="middle" font-weight="600" fill="#2b4365">Engine B (GPU)</text>
    <text x="390" y="220" text-anchor="middle" font-size="11" fill="#2b4365">R7 long-ctx (slack 1.5s)</text>
    <rect x="312" y="232" width="156" height="20" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <rect x="312" y="232" width="110" height="20" rx="3" fill="#2b6cb0"/>
    <text x="390" y="246" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">GPU KV  (44k / 64k tok)</text>
    <text x="390" y="266" text-anchor="middle" font-size="10" fill="#718096">candidate for preempt</text>
  </g>
  <g>
    <rect x="510" y="180" width="200" height="96" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="610" y="202" text-anchor="middle" font-weight="600" fill="#2b4365">Engine C (GPU)</text>
    <text x="610" y="220" text-anchor="middle" font-size="11" fill="#2b4365">idle / spare capacity</text>
    <rect x="532" y="232" width="156" height="20" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="610" y="246" text-anchor="middle" font-size="10" fill="#1a202c">GPU KV  (empty)</text>
    <text x="610" y="266" text-anchor="middle" font-size="10" fill="#718096">target for recovery / resume</text>
  </g>

  <!-- dispatch arrows -->
  <line x1="170" y1="134" x2="170" y2="178" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <line x1="390" y1="134" x2="390" y2="178" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <line x1="610" y1="134" x2="610" y2="178" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <text x="178" y="155" font-size="10" fill="#1a202c">dispatch</text>

  <!-- host memory -->
  <rect x="50" y="316" width="680" height="56" rx="6" fill="#fde7c4" stroke="#c05621" stroke-width="1.5"/>
  <text x="68" y="338" font-weight="600" fill="#7b341e">Host pinned memory · per-engine staging</text>
  <text x="68" y="356" font-size="11" fill="#7b341e">D2H copy every 16 generated tokens, dedicated CUDA stream, overlaps compute</text>

  <!-- ckpt arrows engines -> host -->
  <line x1="170" y1="276" x2="170" y2="314" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="390" y1="276" x2="390" y2="314" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="610" y1="276" x2="610" y2="314" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="178" y="296" font-size="10" fill="#666">ckpt</text>

  <!-- shm -->
  <rect x="50" y="404" width="680" height="76" rx="6" fill="#c6e8d0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="68" y="426" font-weight="600" fill="#22543d">/dev/shm · shared KV pool (cross-engine, mmap, zero-copy reads)</text>
  <text x="68" y="445" font-size="11" fill="#22543d">indexed by (req_id, block_id) · entries kept until request terminates or evicted by LRU</text>
  <rect x="68" y="452" width="100" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="118" y="466" text-anchor="middle" font-size="10" fill="#22543d">R1 [0..511]</text>
  <rect x="178" y="452" width="100" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="228" y="466" text-anchor="middle" font-size="10" fill="#22543d">R7 [0..2750]</text>
  <rect x="288" y="452" width="100" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="338" y="466" text-anchor="middle" font-size="10" fill="#22543d">R2 [0..127]</text>
  <rect x="398" y="452" width="124" height="20" rx="3" fill="#fff" stroke="#2f855a"/><text x="460" y="466" text-anchor="middle" font-size="10" fill="#22543d">R8 preempted [0..900]</text>
  <text x="540" y="466" font-size="10" fill="#22543d">...</text>

  <!-- host -> shm publish -->
  <line x1="390" y1="372" x2="390" y2="402" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="397" y="390" font-size="10" fill="#666">publish</text>

  <!-- engine A failure mark -->
  <line x1="80" y1="184" x2="262" y2="270" stroke="#c53030" stroke-width="3" opacity="0.65"/>
  <line x1="262" y1="184" x2="80" y2="270" stroke="#c53030" stroke-width="3" opacity="0.65"/>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#c53030" font-weight="600">engine fail</text>

  <!-- recovery flow: shm -> Engine C -->
  <path d="M 700 442 Q 748 442 748 230 Q 748 178 712 178" fill="none" stroke="#c53030" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="704" y="350" font-size="11" fill="#c53030" font-weight="600">recovery:</text>
  <text x="704" y="364" font-size="11" fill="#c53030" font-weight="600">R1 KV → C</text>

  <!-- preempt flow: scheduler -> B kick (blue) -->
  <path d="M 487 124 Q 487 158 420 158 Q 390 158 390 178" fill="none" stroke="#2c5282" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="492" y="142" font-size="11" fill="#2c5282" font-weight="600">preempt R7 (high slack)</text>

  <!-- preempt resume flow: shm -> any engine (here C) blue -->
  <path d="M 460 472 Q 460 504 38 504 Q 22 504 22 178 Q 22 158 70 158 L 70 178" fill="none" stroke="#2c5282" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ab)" opacity="0.75"/>
  <text x="30" y="350" font-size="11" fill="#2c5282" font-weight="600" transform="rotate(-90 30 350)">resume later</text>

  <!-- legend -->
  <rect x="50" y="500" width="680" height="30" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
  <line x1="64" y1="515" x2="94" y2="515" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="100" y="519" font-size="11" fill="#1a202c">KV checkpoint (every 16 tok)</text>
  <line x1="252" y1="515" x2="282" y2="515" stroke="#c53030" stroke-width="1.6"/>
  <text x="288" y="519" font-size="11" fill="#1a202c">recovery flow (engine fail)</text>
  <line x1="436" y1="515" x2="466" y2="515" stroke="#2c5282" stroke-width="1.6"/>
  <text x="472" y="519" font-size="11" fill="#1a202c">cheap preempt &amp; resume (tight SLO)</text>
</svg>
