<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
  </defs>

  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Where checkpoint-backed preemption fits in production LLM serving</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#4a5568" font-style="italic">grey = existing vLLM / production infrastructure   ·   green = our additions   ·   blue = GPU resources</text>

  <!-- =================== SECTION A: cluster view =================== -->
  <rect x="20" y="62" width="920" height="280" rx="8" fill="#fafbfc" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="32" y="82" font-size="12" font-weight="700" letter-spacing="0.5" fill="#4a5568">CLUSTER VIEW</text>

  <!-- ingress column -->
  <rect x="36" y="100" width="148" height="32" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="110" y="121" text-anchor="middle" font-size="11" fill="#1a202c">Users / API clients</text>

  <rect x="36" y="146" width="148" height="32" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="110" y="167" text-anchor="middle" font-size="11" fill="#1a202c">API gateway</text>

  <rect x="36" y="192" width="148" height="72" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="110" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#1a202c">Cluster router</text>
  <text x="110" y="228" text-anchor="middle" font-size="10" fill="#4a5568">admission · load balance</text>
  <text x="110" y="242" text-anchor="middle" font-size="10" fill="#4a5568">disruption rerouting</text>
  <text x="110" y="256" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(existing)</text>

  <line x1="110" y1="132" x2="110" y2="144" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <line x1="110" y1="178" x2="110" y2="190" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>

  <!-- engine fleet section -->
  <text x="380" y="110" text-anchor="middle" font-size="11" fill="#4a5568" font-style="italic">engine fleet</text>

  <!-- engine card 0 -->
  <rect x="220" y="118" width="110" height="200" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
  <rect x="220" y="118" width="110" height="22" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="275" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#2b4365">Engine 0</text>
  <text x="275" y="156" text-anchor="middle" font-size="9" fill="#4a5568">tokenizer · http</text>
  <rect x="232" y="166" width="86" height="24" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="275" y="182" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">slack scheduler</text>
  <text x="275" y="206" text-anchor="middle" font-size="9" fill="#4a5568">vLLM executor</text>
  <text x="275" y="220" text-anchor="middle" font-size="9" fill="#4a5568">KV cache mgr</text>
  <rect x="232" y="230" width="86" height="20" rx="3" fill="#c7e3f5" stroke="#2b6cb0"/>
  <text x="275" y="244" text-anchor="middle" font-size="9" fill="#2b4365">GPU HBM</text>
  <rect x="232" y="256" width="86" height="22" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="275" y="271" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">host KV ckpt</text>
  <text x="275" y="298" text-anchor="middle" font-size="9" fill="#888" font-style="italic">[zoom below]</text>

  <!-- engine card 1 -->
  <rect x="350" y="118" width="110" height="200" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
  <rect x="350" y="118" width="110" height="22" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="405" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#2b4365">Engine 1</text>
  <text x="405" y="156" text-anchor="middle" font-size="9" fill="#4a5568">tokenizer · http</text>
  <rect x="362" y="166" width="86" height="24" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="405" y="182" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">slack scheduler</text>
  <text x="405" y="206" text-anchor="middle" font-size="9" fill="#4a5568">vLLM executor</text>
  <text x="405" y="220" text-anchor="middle" font-size="9" fill="#4a5568">KV cache mgr</text>
  <rect x="362" y="230" width="86" height="20" rx="3" fill="#c7e3f5" stroke="#2b6cb0"/>
  <text x="405" y="244" text-anchor="middle" font-size="9" fill="#2b4365">GPU HBM</text>
  <rect x="362" y="256" width="86" height="22" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="405" y="271" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">host KV ckpt</text>

  <!-- engine card n -->
  <text x="490" y="220" font-size="14" fill="#4a5568">⋯</text>

  <rect x="510" y="118" width="110" height="200" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
  <rect x="510" y="118" width="110" height="22" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="565" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#2b4365">Engine n</text>
  <text x="565" y="156" text-anchor="middle" font-size="9" fill="#4a5568">tokenizer · http</text>
  <rect x="522" y="166" width="86" height="24" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="565" y="182" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">slack scheduler</text>
  <text x="565" y="206" text-anchor="middle" font-size="9" fill="#4a5568">vLLM executor</text>
  <text x="565" y="220" text-anchor="middle" font-size="9" fill="#4a5568">KV cache mgr</text>
  <rect x="522" y="230" width="86" height="20" rx="3" fill="#c7e3f5" stroke="#2b6cb0"/>
  <text x="565" y="244" text-anchor="middle" font-size="9" fill="#2b4365">GPU HBM</text>
  <rect x="522" y="256" width="86" height="22" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.3"/>
  <text x="565" y="271" text-anchor="middle" font-size="9" fill="#22543d" font-weight="600">host KV ckpt</text>

  <!-- shared state column -->
  <text x="780" y="110" text-anchor="middle" font-size="11" fill="#4a5568" font-style="italic">cluster shared state</text>

  <rect x="660" y="118" width="240" height="38" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="780" y="135" text-anchor="middle" font-size="11" fill="#1a202c">Model weight store</text>
  <text x="780" y="148" text-anchor="middle" font-size="9" fill="#888">NFS / local SSD</text>

  <rect x="660" y="166" width="240" height="38" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="780" y="183" text-anchor="middle" font-size="11" fill="#1a202c">Metrics / telemetry</text>
  <text x="780" y="196" text-anchor="middle" font-size="9" fill="#888">prometheus, traces</text>

  <rect x="660" y="214" width="240" height="38" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="780" y="231" text-anchor="middle" font-size="11" fill="#1a202c">Failure detector</text>
  <text x="780" y="244" text-anchor="middle" font-size="9" fill="#888">heartbeats · health probes</text>

  <rect x="660" y="262" width="240" height="56" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/>
  <text x="780" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">/dev/shm KV checkpoint pool</text>
  <text x="780" y="294" text-anchor="middle" font-size="10" fill="#22543d">cross-engine readable, mmap</text>
  <text x="780" y="308" text-anchor="middle" font-size="10" fill="#22543d" font-weight="600">[OURS]</text>

  <!-- arrows cluster view -->
  <!-- router -> engine 0/1/n -->
  <line x1="184" y1="216" x2="218" y2="216" stroke="#1a202c" stroke-width="1.2" marker-end="url(#ak)"/>
  <path d="M 184 232 Q 240 232 240 138 L 275 138" fill="none" stroke="#1a202c" stroke-width="1" opacity="0.4" stroke-dasharray="2 2"/>
  <text x="192" y="208" font-size="9" fill="#1a202c">dispatch</text>

  <!-- engines -> /dev/shm (ckpt write) -->
  <path d="M 318 267 Q 640 267 660 280" fill="none" stroke="#2f855a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#agr)"/>
  <text x="478" y="262" font-size="9" fill="#2f855a" font-weight="600">ckpt every 16 tok</text>

  <!-- /dev/shm -> engines (recover/resume) -->
  <path d="M 660 296 Q 320 320 320 178 L 320 178" fill="none" stroke="#c53030" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="438" y="333" font-size="9" fill="#c53030" font-weight="600">recover / resume on any engine</text>

  <!-- failure detector -> cluster router -->
  <path d="M 660 232 Q 360 232 200 232 L 184 232" fill="none" stroke="#888" stroke-width="1" opacity="0.5"/>

  <!-- =================== zoom callout =================== -->
  <line x1="220" y1="318" x2="60" y2="378" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="318" x2="900" y2="378" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- =================== SECTION B: engine zoom =================== -->
  <rect x="20" y="380" width="920" height="320" rx="8" fill="#fafbfc" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="32" y="400" font-size="12" font-weight="700" letter-spacing="0.5" fill="#4a5568">ZOOM: ENGINE INTERNALS</text>
  <text x="180" y="400" font-size="11" fill="#888" font-style="italic">(what's inside one Engine box above)</text>

  <!-- big engine container -->
  <rect x="40" y="416" width="600" height="270" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="1.6"/>
  <rect x="40" y="416" width="600" height="26" rx="6" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="340" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#2b4365">Engine 0  (one vLLM instance)</text>

  <!-- layer 1: http -->
  <rect x="56" y="456" width="568" height="32" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="340" y="476" text-anchor="middle" font-size="11" fill="#1a202c">HTTP server + tokenizer</text>

  <!-- layer 2: local scheduler [OURS partial] -->
  <rect x="56" y="498" width="568" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/>
  <text x="340" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">Local scheduler · batches running requests · slack-priority preempt of long-context [OURS]</text>
  <text x="340" y="534" text-anchor="middle" font-size="10" fill="#22543d">extends vLLM scheduler with slack ordering + preemption decision</text>

  <!-- layer 3: vLLM executor -->
  <rect x="56" y="552" width="568" height="32" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="340" y="572" text-anchor="middle" font-size="11" fill="#1a202c">vLLM executor · PagedAttention forward pass</text>

  <!-- layer 4: KV cache manager -->
  <rect x="56" y="592" width="568" height="32" rx="4" fill="#edf2f7" stroke="#4a5568"/>
  <text x="340" y="612" text-anchor="middle" font-size="11" fill="#1a202c">KV cache manager (paged, 16-token blocks)</text>

  <!-- layer 5: GPU HBM -->
  <rect x="56" y="634" width="280" height="44" rx="4" fill="#c7e3f5" stroke="#2b6cb0"/>
  <text x="196" y="652" text-anchor="middle" font-size="11" font-weight="600" fill="#2b4365">GPU HBM</text>
  <text x="196" y="668" text-anchor="middle" font-size="10" fill="#2b4365">model weights · GPU KV cache</text>

  <!-- layer 6: host pinned mem [OURS] -->
  <rect x="344" y="634" width="280" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/>
  <text x="484" y="652" text-anchor="middle" font-size="11" font-weight="700" fill="#22543d">Host pinned memory · D2H ckpt every 16 tok [OURS]</text>
  <text x="484" y="668" text-anchor="middle" font-size="10" fill="#22543d">staging buffer · publishes to /dev/shm above</text>

  <!-- arrow GPU HBM -> host pinned mem -->
  <line x1="336" y1="656" x2="344" y2="656" stroke="#2f855a" stroke-width="1.4" marker-end="url(#agr)"/>

  <!-- ============ summary panel right side ============ -->
  <rect x="660" y="416" width="280" height="270" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.4"/>
  <text x="676" y="438" font-weight="700" fill="#744210" font-size="13">Our 3 additions, in context</text>

  <rect x="676" y="450" width="14" height="14" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.4"/>
  <text x="696" y="461" font-size="11" fill="#744210" font-weight="600">Slack-priority scheduler</text>
  <text x="696" y="476" font-size="10" fill="#744210">extends per-engine scheduler;</text>
  <text x="696" y="490" font-size="10" fill="#744210">may preempt running long-ctx.</text>

  <rect x="676" y="504" width="14" height="14" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.4"/>
  <text x="696" y="515" font-size="11" fill="#744210" font-weight="600">Host KV checkpoint</text>
  <text x="696" y="530" font-size="10" fill="#744210">async D2H every 16 tok from</text>
  <text x="696" y="544" font-size="10" fill="#744210">GPU HBM to pinned memory.</text>

  <rect x="676" y="558" width="14" height="14" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.4"/>
  <text x="696" y="569" font-size="11" fill="#744210" font-weight="600">/dev/shm shared pool</text>
  <text x="696" y="584" font-size="10" fill="#744210">cluster-visible KV state for</text>
  <text x="696" y="598" font-size="10" fill="#744210">recovery + cheap-preempt resume.</text>

  <text x="676" y="624" font-size="10" fill="#744210" font-style="italic">Everything else (gateway, router,</text>
  <text x="676" y="638" font-size="10" fill="#744210" font-style="italic">tokenizer, executor, KV mgr,</text>
  <text x="676" y="652" font-size="10" fill="#744210" font-style="italic">failure detector, telemetry,</text>
  <text x="676" y="666" font-size="10" fill="#744210" font-style="italic">model store) is unchanged.</text>
</svg>
