<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5282"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
  </defs>

  <text x="420" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">System overview · control plane / data plane</text>

  <!-- outer container -->
  <rect x="20" y="48" width="800" height="500" rx="8" fill="#fafbfc" stroke="#cbd5e0" stroke-width="1.2"/>

  <!-- vertical divider -->
  <line x1="312" y1="80" x2="312" y2="538" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="166" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568" letter-spacing="0.5">CONTROL PLANE</text>
  <text x="566" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568" letter-spacing="0.5">DATA PLANE</text>

  <!-- ================= CONTROL PLANE ================= -->

  <!-- Request scheduler -->
  <rect x="40" y="92" width="252" height="84" rx="6" fill="#e2d8f3" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="166" y="112" text-anchor="middle" font-weight="600" fill="#44337a">Request Scheduler</text>
  <text x="166" y="128" text-anchor="middle" font-size="11" fill="#553c9a">slack-priority · preempt decision</text>
  <rect x="52" y="140" width="56" height="20" rx="10" fill="#fff" stroke="#6b46c1"/>
  <text x="80" y="154" text-anchor="middle" font-size="10" fill="#553c9a">R3 · 0.2s</text>
  <rect x="114" y="140" width="56" height="20" rx="10" fill="#fff" stroke="#6b46c1"/>
  <text x="142" y="154" text-anchor="middle" font-size="10" fill="#553c9a">R4 · 0.5s</text>
  <rect x="176" y="140" width="56" height="20" rx="10" fill="#fff" stroke="#6b46c1"/>
  <text x="204" y="154" text-anchor="middle" font-size="10" fill="#553c9a">R5 · 1.2s</text>
  <text x="244" y="154" font-size="10" fill="#553c9a">...</text>

  <!-- Checkpoint controller -->
  <rect x="40" y="190" width="252" height="60" rx="6" fill="#fde7c4" stroke="#c05621" stroke-width="1.5"/>
  <text x="166" y="210" text-anchor="middle" font-weight="600" fill="#7b341e">Checkpoint Controller</text>
  <text x="166" y="226" text-anchor="middle" font-size="11" fill="#7b341e">ckpt cadence per request</text>
  <text x="166" y="242" text-anchor="middle" font-size="10" fill="#a0532e" font-style="italic">(can be slack-aware)</text>

  <!-- Recovery manager -->
  <rect x="40" y="264" width="252" height="60" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
  <text x="166" y="284" text-anchor="middle" font-weight="600" fill="#742a2a">Recovery &amp; Resume Manager</text>
  <text x="166" y="300" text-anchor="middle" font-size="11" fill="#742a2a">on fail → reload</text>
  <text x="166" y="316" text-anchor="middle" font-size="11" fill="#742a2a">on preempt → resume</text>

  <!-- Failure detector -->
  <rect x="40" y="338" width="252" height="46" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="166" y="358" text-anchor="middle" font-weight="600" fill="#1a202c">Failure Detector</text>
  <text x="166" y="374" text-anchor="middle" font-size="11" fill="#4a5568">heartbeats · engine health</text>

  <!-- intra-control-plane arrows -->
  <!-- failure detector -> recovery manager -->
  <line x1="240" y1="338" x2="240" y2="326" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <!-- recovery manager -> scheduler -->
  <line x1="240" y1="264" x2="240" y2="178" stroke="#1a202c" stroke-width="1" marker-end="url(#ak)"/>
  <text x="248" y="220" font-size="10" fill="#4a5568">notify</text>

  <!-- ================= DATA PLANE ================= -->

  <!-- engine 0 -->
  <g>
    <rect x="332" y="92" width="270" height="48" rx="4" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
    <text x="344" y="120" font-size="11" font-weight="700" fill="#2b4365">Engine 0</text>
    <rect x="400" y="100" width="92" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="446" y="120" text-anchor="middle" font-size="10" fill="#2b4365">model weights</text>
    <rect x="500" y="100" width="94" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="547" y="120" text-anchor="middle" font-size="10" fill="#2b4365">GPU KV cache</text>
  </g>
  <!-- engine 1 -->
  <g>
    <rect x="332" y="148" width="270" height="48" rx="4" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
    <text x="344" y="176" font-size="11" font-weight="700" fill="#2b4365">Engine 1</text>
    <rect x="400" y="156" width="92" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="446" y="176" text-anchor="middle" font-size="10" fill="#2b4365">model weights</text>
    <rect x="500" y="156" width="94" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="547" y="176" text-anchor="middle" font-size="10" fill="#2b4365">GPU KV cache</text>
  </g>
  <!-- dots -->
  <text x="467" y="218" text-anchor="middle" font-size="16" fill="#4a5568">⋮</text>
  <!-- engine n -->
  <g>
    <rect x="332" y="232" width="270" height="48" rx="4" fill="#c7e3f5" stroke="#2b6cb0" stroke-width="1.4"/>
    <text x="344" y="260" font-size="11" font-weight="700" fill="#2b4365">Engine n</text>
    <rect x="400" y="240" width="92" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="446" y="260" text-anchor="middle" font-size="10" fill="#2b4365">model weights</text>
    <rect x="500" y="240" width="94" height="32" rx="3" fill="#fff" stroke="#2b6cb0"/>
    <text x="547" y="260" text-anchor="middle" font-size="10" fill="#2b4365">GPU KV cache</text>
  </g>

  <!-- RAM column header (subtle) -->
  <text x="700" y="86" text-anchor="middle" font-size="10" fill="#4a5568" font-style="italic">host RAM</text>

  <!-- host pinned memory -->
  <rect x="616" y="92" width="172" height="188" rx="6" fill="#fde7c4" stroke="#c05621" stroke-width="1.5"/>
  <text x="702" y="118" text-anchor="middle" font-weight="600" fill="#7b341e">Host pinned</text>
  <text x="702" y="134" text-anchor="middle" font-weight="600" fill="#7b341e">memory</text>
  <text x="702" y="158" text-anchor="middle" font-size="10" fill="#7b341e">per-engine</text>
  <text x="702" y="172" text-anchor="middle" font-size="10" fill="#7b341e">staging buffer</text>
  <text x="702" y="196" text-anchor="middle" font-size="10" fill="#7b341e">async D2H copy</text>
  <text x="702" y="210" text-anchor="middle" font-size="10" fill="#7b341e">every 16 tok</text>
  <text x="702" y="224" text-anchor="middle" font-size="10" fill="#7b341e">on dedicated</text>
  <text x="702" y="238" text-anchor="middle" font-size="10" fill="#7b341e">CUDA stream</text>

  <!-- shm pool -->
  <rect x="332" y="300" width="456" height="180" rx="6" fill="#c6e8d0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="560" y="324" text-anchor="middle" font-weight="600" fill="#22543d">/dev/shm · KV checkpoint pool</text>
  <text x="560" y="342" text-anchor="middle" font-size="11" fill="#22543d">cross-engine readable · mmap, zero-copy · indexed by (req_id, block_id)</text>

  <!-- pool entries -->
  <rect x="350" y="360" width="120" height="24" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="410" y="376" text-anchor="middle" font-size="10" fill="#22543d">R1 KV [0..511]</text>
  <rect x="480" y="360" width="120" height="24" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="540" y="376" text-anchor="middle" font-size="10" fill="#22543d">R7 KV [0..2750]</text>
  <rect x="610" y="360" width="160" height="24" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="690" y="376" text-anchor="middle" font-size="10" fill="#22543d">R8 KV [0..900] (preempted)</text>

  <rect x="350" y="394" width="120" height="24" rx="3" fill="#fff" stroke="#2f855a"/>
  <text x="410" y="410" text-anchor="middle" font-size="10" fill="#22543d">R2 KV [0..127]</text>
  <text x="490" y="410" font-size="10" fill="#22543d">...</text>

  <text x="350" y="442" font-size="11" fill="#22543d">Use 1.  recover after engine fail  →  any peer engine reads &amp; resumes</text>
  <text x="350" y="460" font-size="11" fill="#22543d">Use 2.  cheap preempt of long-context  →  resume later from same blocks</text>

  <!-- ================= cross-plane arrows ================= -->

  <!-- scheduler -> engines (dispatch / preempt) -->
  <path d="M 292 134 L 326 134 L 326 116 L 330 116" fill="none" stroke="#1a202c" stroke-width="1.3" marker-end="url(#ak)"/>
  <path d="M 292 134 L 326 134 L 326 172 L 330 172" fill="none" stroke="#1a202c" stroke-width="1.3" marker-end="url(#ak)"/>
  <path d="M 292 134 L 326 134 L 326 256 L 330 256" fill="none" stroke="#1a202c" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="296" y="100" font-size="10" fill="#1a202c" font-weight="600">dispatch / preempt</text>

  <!-- ckpt controller -> engines (cadence config) -->
  <path d="M 292 220 L 320 220 L 320 184 L 330 184" fill="none" stroke="#888" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#ag)"/>
  <text x="296" y="240" font-size="10" fill="#666">configure cadence</text>

  <!-- recovery manager -> engine n (rehydrate target) -->
  <path d="M 292 290 L 322 290 L 322 268 L 330 268" fill="none" stroke="#c53030" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="296" y="304" font-size="10" fill="#c53030">rehydrate target</text>

  <!-- ================= intra-data-plane arrows ================= -->

  <!-- engines -> host pinned mem (3 small dashed) -->
  <line x1="602" y1="116" x2="616" y2="116" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="602" y1="172" x2="616" y2="172" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <line x1="602" y1="256" x2="616" y2="256" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>

  <!-- host pinned -> shm pool -->
  <line x1="702" y1="280" x2="702" y2="298" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="708" y="294" font-size="10" fill="#666">publish</text>

  <!-- shm pool -> engine n (recover/resume) — two small arrows -->
  <line x1="400" y1="300" x2="400" y2="282" stroke="#c53030" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="332" y="298" font-size="10" fill="#c53030" font-weight="600">recover →</text>
  <line x1="520" y1="300" x2="520" y2="282" stroke="#2c5282" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="528" y="298" font-size="10" fill="#2c5282" font-weight="600">← resume</text>

  <!-- ================= legend ================= -->
  <line x1="40" y1="498" x2="60" y2="498" stroke="#1a202c" stroke-width="1.3"/>
  <text x="66" y="502" font-size="10" fill="#1a202c">control flow</text>
  <line x1="158" y1="498" x2="178" y2="498" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="184" y="502" font-size="10" fill="#1a202c">KV data flow</text>
  <line x1="286" y1="498" x2="306" y2="498" stroke="#c53030" stroke-width="1.5"/>
  <text x="312" y="502" font-size="10" fill="#1a202c">recovery path</text>
  <line x1="414" y1="498" x2="434" y2="498" stroke="#2c5282" stroke-width="1.5"/>
  <text x="440" y="502" font-size="10" fill="#1a202c">cheap-preempt resume path</text>
</svg>
