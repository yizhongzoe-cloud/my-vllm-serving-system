# Full experiment config — Llama-3.2-1B (1B)
# 包含 E0-E6 全部实验定义，手动填入 RPS 和 SLO（跳过 calibrate.py）
# 正式论文用 8B/70B，这个 1B 用于开发验证

# ---- Hardware & Model ----
model: "meta-llama/Llama-3.2-1B-Instruct"
model_tag: "1B"
max_model_len: 2048
gpu_memory_utilization: 0.45
dtype: "float16"
enforce_eager: true
dp_size: 2

# ---- Solver / FT parameters ----
# Tuned from tiny experiment: original 4000/2000 caused 33% rejection
ft_prefill_throughput: 40000.0   # actual ~45000 tok/s for 1B
ft_decode_throughput: 150.0      # actual ~143 tok/s per-request
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 0.5
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_1b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 8589934592  # 8 GB
force_output_len: true

# ---- Workloads ----
workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Chatbot, decode-heavy"

  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Summarization, prefill-heavy"

  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
    description: "Instruction-following, tight SLO"

  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"
    description: "Production mix, per-request SLO differentiation"

# ---- Load levels ----
# 手动设定 RPS（基于 smoke test 观察，1B dp=2 大约 5-8 rps 饱和）
# 正式跑建议先用 calibrate.py 自动校准
load_levels:
  Light:    {pct: 0.25, rps: 1.5}
  Moderate: {pct: 0.40, rps: 2.5}
  Heavy:    {pct: 0.55, rps: 3.5}

# ---- SLO ----
# 手动设定（基于 smoke test: TTFT_base ~30-150ms, TPOT_base ~7-15ms）
slo:
  ttft_ms: 2000.0           # ~5x worst-case TTFT_base
  failure_gap_ms: 3000.0    # ~3x estimated gap base
  ttft_base_ms: 400.0       # reference
  gap_base_ms: 1000.0       # reference

# ---- Fault injection ----
fault_timing:
  none: null
  F1_Early: 60.0     # 刚进稳态
  F2_Mid: 150.0      # 稳态中期（主实验）
  F3_Late: 240.0     # 稳态后期

# ---- Run parameters ----
run_duration_sec: 300.0     # 5 分钟
warmup_sec: 30.0
seeds: [42, 123, 456]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

# ---- Baselines ----
baselines:
  No-FT:
    scheduling_policy: "fcfs"
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0

  Periodic-Low:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Periodic-High:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 1

  Benders-Only:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Adaptive-Only:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

# ---- Experiments ----
# 总计: 864 + 8 + 40 + 16 + 12 + 12 = 952 runs (per seed × 3 = 2856)
# 单 seed 估计: ~952 runs × 8 min ≈ 5.3 天

experiments:
  # 快速验证 (4 runs)
  E0_Smoke:
    description: "Pipeline validation"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

  # 端到端主实验 (6×4×3×4 = 288 runs/seed, ×3 seeds = 864)
  E1a_Main:
    description: "End-to-end: all baselines × all workloads × all loads × all faults"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High",
                 "Benders-Only", "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none", "F1_Early", "F2_Mid", "F3_Late"]

  # 恢复时间分解 (4×2×1×1 = 8 runs/seed)
  E2_Recovery:
    description: "Recovery breakdown: detailed failover timeline"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]

  # 消融实验 (5×2×2×2 = 40 runs/seed)
  E3_Ablation:
    description: "Ablation: Benders vs Adaptive vs Both"
    baselines: ["Periodic-Low", "Periodic-High", "Benders-Only",
                 "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  # Checkpoint 权衡 (4×1×2×2 = 16 runs/seed)
  E4_Checkpoint_Tradeoff:
    description: "Checkpoint overhead vs recovery benefit"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  # Solver 开销 (1×4×3×1 = 12 runs/seed)
  E5_Controller:
    description: "Benders solver overhead at different loads"
    baselines: ["Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none"]

  # SLO 敏感度 (2×2×1×1×3 = 12 runs/seed)
  E6_SLO_Sensitivity:
    description: "SLO tightness sensitivity"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]
    slo_scales:
      Tight:    {ttft_mult: 3.0,  gap_mult: 1.5}
      Moderate: {ttft_mult: 5.0,  gap_mult: 3.0}
      Loose:    {ttft_mult: 10.0, gap_mult: 5.0}

results_dir: "results_v2"
