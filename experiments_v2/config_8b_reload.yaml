model: meta-llama/Llama-3.1-8B-Instruct
model_tag: 8B
max_model_len: 33024
gpu_memory_utilization: 0.9
dtype: float16
enforce_eager: true
dp_size: 1
ft_prefill_throughput: 4000.0
ft_decode_throughput: 2000.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 1.0
ft_checkpoint_cost_profile: experiments_v2/checkpoint_cost_profile_8b.json
ft_decode_capacity_profile: experiments_v2/decode_capacity_profile_8b.json
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 137438953472
force_output_len: true

# Same RULER NIAH truncated datasets as Phase 1 (ckpt overhead).
# Phase 2 reuses these to keep prompts paired with Phase 1 measurements
# (TTFT/reprefill cost from Phase 1 metrics.json + reload cost from this
# sweep -> single recovery-time-vs-context figure).
workloads:
  W_Ruler1K:
    dataset: ruler_1024_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_1024_niah_trunc.jsonl
    tpot_slo_ms: 100.0
    arrival: poisson
    description: RULER NIAH truncated to 1024 tokens
  W_Ruler4K:
    dataset: ruler_4096_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_4096_niah_trunc.jsonl
    tpot_slo_ms: 200.0
    arrival: poisson
    description: RULER NIAH truncated to 4096 tokens
  W_Ruler8K:
    dataset: ruler_8192_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_8192_niah_trunc.jsonl
    tpot_slo_ms: 300.0
    arrival: poisson
    description: RULER NIAH truncated to 8192 tokens
  W_Ruler16K:
    dataset: ruler_16384_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_16384_niah_trunc.jsonl
    tpot_slo_ms: 400.0
    arrival: poisson
    description: RULER NIAH truncated to 16384 tokens
  W_Ruler32K:
    dataset: ruler_32768_niah_trunc
    dataset_path: experiments_v2/datasets/cached/ruler_32768_niah_trunc.jsonl
    tpot_slo_ms: 600.0
    arrival: poisson
    description: RULER NIAH truncated to 32768 tokens

# Phase 2 needs capacity-driven preempt to FIRE. We bump RPS ~1.5x vs
# Phase 1 (which deliberately stayed below preempt threshold). For
# short contexts (1K/4K/8K), KV is small so even high RPS may not
# trigger many preempts — that's fine, those cells become the "low-
# preempt-rate" baseline. For 16K/32K, this RPS should produce 5-50
# preempt+reload events per cell, enough for stable percentile stats.
load_levels:
  Pressure_1K:
    pct: 0.85
    rps: 12.0
  Pressure_4K:
    pct: 0.85
    rps: 5.0
  Pressure_8K:
    pct: 0.85
    rps: 2.5
  Pressure_16K:
    pct: 0.85
    rps: 1.2
  Pressure_32K:
    pct: 0.85
    rps: 0.5

slo:
  ttft_ms: 30000.0
  failure_gap_ms: 5000.0
  ttft_base_ms: 1500.0
  gap_base_ms: 4000.0

fault_timing:
  none: null

run_duration_sec: 360.0
warmup_sec: 60.0
seeds:
- 42
- 123
- 456
request_timeout_sec: 600.0
server_startup_timeout: 600.0

# Two baselines:
# - NoFT-Reprefill: vanilla vLLM, capacity preempt -> RECOMPUTE
#   (full reprefill on resume).
# - CkptReload: enable_checkpointing + fixed_checkpoint_blocks=1
#   + FT_CAPACITY_PREEMPT_RELOAD=1 (set in sweep script env).
#   Capacity preempt routes through _preempt_for_slo -> reload from
#   host checkpoint on resume. SLO/Benders/M3 all OFF, so the only
#   preempt source is vLLM-native capacity-driven.
baselines:
  NoFT-Reprefill:
    scheduling_policy: fcfs
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0
  CkptReload:
    scheduling_policy: fault_tolerant
    enable_checkpointing: true
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 1

experiments:
  E_ReloadCost:
    description: Recovery time vs context (reprefill vs reload, paired)
    baselines:
    - NoFT-Reprefill
    - CkptReload
    workloads:
    - W_Ruler1K
    - W_Ruler4K
    - W_Ruler8K
    - W_Ruler16K
    - W_Ruler32K
    load_levels:
    - Pressure_1K
    - Pressure_4K
    - Pressure_8K
    - Pressure_16K
    - Pressure_32K
    faults:
    - none
