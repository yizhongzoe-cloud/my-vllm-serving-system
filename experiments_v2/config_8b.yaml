# Experiment configuration — Llama-3.1-8B (primary, full sweep)
# Main paper results come from this config.

# ---- Hardware & Model ----
model: "meta-llama/Llama-3.1-8B-Instruct"
model_tag: "8B"
max_model_len: 4096
gpu_memory_utilization: 0.90
dtype: "float16"
enforce_eager: true
dp_size: 2  # 2 GPUs for now; change to 4 for paper experiments

# ---- Solver / FT parameters ----
# NOTE: ft_prefill/decode_throughput are legacy fallback values.
# The decode-first capacity model (ft_decode_capacity_profile) is preferred.
# kv_bytes_per_token is auto-computed from model config (no need to set).
ft_prefill_throughput: 4000.0
ft_decode_throughput: 2000.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 1.0
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_8b.json"
ft_decode_capacity_profile: "experiments_v2/decode_capacity_profile_8b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 34359738368  # 32 GB

force_output_len: true

# ---- Workloads ----
workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
    description: "Chatbot, decode-heavy"

  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
    description: "Summarization, prefill-heavy"

  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
    description: "Instruction-following, tight SLO"

  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"
    description: "Production mix, per-request SLO differentiation"

# ---- Load levels ----
# Manual estimates for 8B dp=2 on A6000. Run calibrate.py for precise values.
load_levels:
  Light:    {pct: 0.25, rps: 0.5}
  Moderate: {pct: 0.40, rps: 1.0}
  Heavy:    {pct: 0.55, rps: 1.5}

# ---- SLO ----
# Manual estimates based on 8B profile (prefill ~35ms, TPOT ~30-50ms).
slo:
  ttft_ms: 2000.0
  failure_gap_ms: 3000.0
  ttft_base_ms: 200.0
  gap_base_ms: 1000.0

# ---- Fault injection ----
fault_timing:
  none: null
  F1_Early: 60.0
  F2_Mid: 150.0
  F3_Late: 240.0

# ---- Run parameters ----
run_duration_sec: 300.0
warmup_sec: 30.0
# seeds: [42, 123, 456]
seeds: [42]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

# ---- Baselines ----
baselines:
  No-FT:
    scheduling_policy: "fcfs"
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0

  Periodic-Low:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Periodic-High:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 1

  Benders-Only:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10

  Adaptive-Only:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

# ---- Experiments ----
experiments:
  E0_Smoke:
  # 4
    description: "Pipeline validation"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

  E1a_Main:
  # 288
    description: "End-to-end (8B full sweep)"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High",
                 "Benders-Only", "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none", "F1_Early", "F2_Mid", "F3_Late"]

  E2_Recovery:
  # 8
    description: "Recovery breakdown"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat", "W2_Summary"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]

  E3_Ablation:
  # 40
    description: "Joint optimization ablation"
    baselines: ["Periodic-Low", "Periodic-High", "Benders-Only",
                 "Adaptive-Only", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E4_Checkpoint_Tradeoff:
  # 16
    description: "Checkpoint overhead vs recovery benefit"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High", "Our-System"]
    workloads: ["W1_Chat"]
    load_levels: ["Moderate", "Heavy"]
    faults: ["none", "F2_Mid"]

  E5_Controller:
  # 12
    description: "Solver overhead"
    baselines: ["Our-System"]
    workloads: ["W1_Chat", "W2_Summary", "W3_Instruct", "W4_Mixed"]
    load_levels: ["Light", "Moderate", "Heavy"]
    faults: ["none"]

  E6_SLO_Sensitivity:
  # 4
    description: "SLO sensitivity"
    baselines: ["No-FT", "Our-System"]
    workloads: ["W1_Chat", "W4_Mixed"]
    load_levels: ["Moderate"]
    faults: ["F2_Mid"]
    slo_scales:
      Tight:    {ttft_mult: 3.0,  gap_mult: 1.5}
      Moderate: {ttft_mult: 5.0,  gap_mult: 3.0}
      Loose:    {ttft_mult: 10.0, gap_mult: 5.0}

results_dir: "results_v2"
