# Tiny experiment — quick validation, ~36 min total
model: "meta-llama/Llama-3.2-1B-Instruct"
model_tag: "1B"
max_model_len: 2048
gpu_memory_utilization: 0.45
dtype: "float16"
enforce_eager: true
dp_size: 2

ft_prefill_throughput: 40000.0
ft_decode_throughput: 150.0
ft_load_bandwidth: 10.0e9
ft_planning_horizon: 0.5
ft_checkpoint_cost_profile: "experiments_v2/checkpoint_cost_profile_1b.json"
failure_detection_time_ms: 100.0
failure_timeout_sec: 5.0
checkpoint_pool_bytes: 8589934592
force_output_len: true

workloads:
  W1_Chat:
    dataset: "sharegpt"
    dataset_path: "experiments_v2/datasets/cached/sharegpt_5000.jsonl"
    tpot_slo_ms: 100.0
    arrival: "poisson"
  W2_Summary:
    dataset: "cnndm"
    dataset_path: "experiments_v2/datasets/cached/cnndm_3000.jsonl"
    tpot_slo_ms: 200.0
    arrival: "poisson"
  W3_Instruct:
    dataset: "alpaca"
    dataset_path: "experiments_v2/datasets/cached/alpaca_full.jsonl"
    tpot_slo_ms: 50.0
    arrival: "poisson"
  W4_Mixed:
    mix:
      - {workload: "W1_Chat", weight: 0.50}
      - {workload: "W3_Instruct", weight: 0.20}
      - {workload: "W2_Summary", weight: 0.30}
    arrival: "poisson"

load_levels:
  Moderate: {pct: 0.40, rps: 2.0}

slo:
  ttft_ms: 2000.0
  failure_gap_ms: 3000.0
  ttft_base_ms: 400.0
  gap_base_ms: 1000.0

fault_timing:
  none: null
  F2_Mid: 30.0

run_duration_sec: 60.0
warmup_sec: 10.0
seeds: [42]
request_timeout_sec: 120.0
server_startup_timeout: 300.0

baselines:
  No-FT:
    scheduling_policy: "fcfs"
    enable_checkpointing: false
    max_gpu_failures: 0
    fixed_checkpoint_blocks: 0
  Periodic-Low:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10
  Periodic-High:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 1
  Benders-Only:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 10
  Adaptive-Only:
    scheduling_policy: "fault_tolerant"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0
  Our-System:
    scheduling_policy: "ft_benders_centralized"
    enable_checkpointing: true
    max_gpu_failures: 1
    fixed_checkpoint_blocks: 0

experiments:
  E_Tiny:
    description: "Tiny validation: 6 baselines × W4_Mixed × Moderate × 2 faults"
    baselines: ["No-FT", "Periodic-Low", "Periodic-High",
                 "Benders-Only", "Adaptive-Only", "Our-System"]
    workloads: ["W4_Mixed"]
    load_levels: ["Moderate"]
    faults: ["none", "F2_Mid"]

results_dir: "results_v2"
